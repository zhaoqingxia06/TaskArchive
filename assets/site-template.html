}.badge{font-size:8px}.task-body{padding-top:8px}.task-meta{font-size:9px}.task-id{font-size:8px}.message{padding-left:0;gap:8px}.read-more{font-size:9px}.message-text{font-size:12px}h3{font-size:14px}footer{display:block;font-size:10px}footer .comparison{margin-top:14px}.dialog-head{padding:16px 18px}.dialog-content{padding:18px}.dialog-content #fulltext{font-size:13px}}

</style></head><body><div class="page">
<nav aria-label="主要页面" style="display:flex;gap:24px;padding-top:24px"><a href="./index.html" aria-current="page">任务档案</a><a href="./knowledge.html">知识库</a></nav><header class="masthead"><div><h1>{{TITLE}}</h1><p class="stats">{{STATS}}</p></div><div class="header-tools"><label class="search">⌕ <input id="search" type="search" placeholder="搜索项目、需求与原文" aria-label="搜索项目、需求与原文"></label><div class="edition">最近同步 <time>{{UPDATED}}</time></div></div></header>
<nav class="tabbar" role="tablist" aria-label="按分类浏览">{{TABS}}</nav>
<div class="toolbar"><div class="source-filters" role="group" aria-label="筛选来源">{{SOURCES}}</div></div>
<main id="archive-panel" role="tabpanel" aria-labelledby="tab-all">{{SECTIONS}}</main><div class="empty" id="empty" hidden>没有匹配的需求</div><p id="result-status" aria-live="polite" class="coverage"></p>
<footer><div><p>按需求归并 · 展开查看原文与时间 · 日期表示已接入记录范围</p><p class="coverage">{{COVERAGE}}</p></div><a id="download-data" download="tasks.json">下载任务数据</a></footer></div>
<script id="archive-data" type="application/json">{{DATA}}</script><script>
(()=>{'use strict';const data=JSON.parse(document.getElementById('archive-data').textContent),tabs=[...document.querySelectorAll('[role="tab"]')],input=document.getElementById('search'),sourceButtons=[...document.querySelectorAll('[data-source]')],panel=document.getElementById('archive-panel');let active='all',source='all';
const download=document.getElementById('download-data');download.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
function filter(){let count=0;const q=input.value.trim().toLocaleLowerCase();for(const cat of panel.querySelectorAll('.category')){let cc=0;for(const project of cat.querySelectorAll('.group')){let pc=0;for(const row of project.querySelectorAll('.task')){const allowed=(active==='all'||active===cat.dataset.category)&&(!q||row.dataset.search.includes(q))&&(source==='all'||JSON.parse(row.dataset.sources).includes(source));row.hidden=!allowed;if(allowed){pc++;cc++;count++;}}project.hidden=!pc;project.querySelector('.group-count').textContent=pc+' 条需求';}cat.hidden=!cc;cat.querySelector('.category-heading>span').textContent=cc+' 条需求';}document.getElementById('empty').hidden=count>0;document.getElementById('result-status').textContent='显示 '+count+' 条需求';}
function select(tab){active=tab.dataset.category;for(const t of tabs){const yes=t===tab;t.setAttribute('aria-selected',String(yes));t.tabIndex=yes?0:-1;}panel.setAttribute('aria-labelledby',tab.id);filter();}
tabs.forEach((t,i)=>{t.addEventListener('click',()=>select(t));t.addEventListener('keydown',e=>{let n;if(e.key==='ArrowRight')n=(i+1)%tabs.length;if(e.key==='ArrowLeft')n=(i-1+tabs.length)%tabs.length;if(e.key==='Home')n=0;if(e.key==='End')n=tabs.length-1;if(n!==undefined){e.preventDefault();tabs[n].focus();select(tabs[n]);}});});input.addEventListener('input',()=>{filter();for(const project of panel.querySelectorAll('.group')){project.open=!!input.value.trim()&&!project.hidden;}});sourceButtons.forEach(button=>button.addEventListener('click',()=>{source=button.dataset.source;sourceButtons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));filter();}));filter();})();
</script></body></html>
