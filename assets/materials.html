<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料集 · TaskArchive</title><style>
:root{--bg:#f8f7f4;--ink:#222c3d;--muted:#79818c;--line:#e2e3e1;--blue:#344d78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,input,textarea,select{font:inherit;color:inherit}a{color:inherit;text-decoration:none}.top{max-width:1380px;margin:auto;padding:24px 44px 0;display:flex;gap:28px;color:#718093}.top a[aria-current]{color:var(--blue);font-weight:650;border-bottom:2px solid var(--blue);padding-bottom:9px}.shell{max-width:1380px;margin:auto;padding:35px 44px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h1{font:700 34px Georgia,'Songti SC',serif;margin:0}.head p,.hint,.meta{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;padding:8px 12px}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:12px;min-height:60vh;overflow:hidden}.sidebar{background:#f5f5f2;border-right:1px solid var(--line);padding:18px}.sidebar input,.sidebar select,input,textarea,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:white}.sidebar select{margin:10px 0}.item{display:block;text-align:left;width:100%;border:0;background:transparent;margin:4px 0}.item.active{background:#e4eaf3;color:#29436e}.item small{display:block;color:var(--muted)}main{padding:38px clamp(24px,5vw,70px);min-width:0}main h2{font-size:26px;margin:0 0 10px}main h3{margin:28px 0 8px}main p{white-space:pre-wrap;overflow-wrap:anywhere}.link{color:var(--blue);text-decoration:underline;overflow-wrap:anywhere}.status{color:#79633a;background:#faf3e4;border-radius:5px;padding:3px 8px}.hint{font-size:12px}.danger{color:#a44242}dialog{width:min(680px,calc(100% - 28px));max-height:90vh;border:0;border-radius:12px;padding:24px;box-shadow:0 15px 80px #0003}dialog::backdrop{background:#26334577}form{display:grid;gap:10px}label{display:grid;gap:4px}textarea{min-height:90px;resize:vertical}.buttons{display:flex;justify-content:flex-end;gap:8px}[hidden]{display:none!important}@media(max-width:700px){.top{padding:18px 20px 0}.shell{padding:24px 16px}.head{display:block}.actions{margin:16px 0}.layout{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line)}main{padding:28px 22px}}
</style></head><body><nav class="top" aria-label="主要页面"><a href="./index.html">任务档案</a><a href="./knowledge.html">知识库</a><a href="./materials.html" aria-current="page">资料集</a></nav><div class="shell"><header class="head"><div><h1>资料集</h1><p>收藏网页与视频，保存来源和阅读笔记。</p></div><div class="actions"><button id="export">导出备份</button><button id="import">导入备份</button><button id="add" class="primary">＋ 添加资料</button><input id="file" type="file" accept=".json,application/json" hidden></div></header><p class="hint">资料仅保存在当前浏览器，不会自动跨设备同步。添加链接后请将链接发给 Agent 处理；这里不会自动抓取或更新知识库。</p><div class="layout"><aside class="sidebar"><input id="search" type="search" placeholder="搜索标题、主题、链接"><select id="filter" aria-label="筛选类型"><option value="">全部资料</option><option value="网页">网页</option><option value="视频">视频</option></select><div id="list"></div></aside><main id="reader"></main></div></div><dialog id="editor"><form id="form"><h2 id="form-title">添加资料</h2><label>链接<input id="url" type="url" placeholder="https://..." required></label><label>类型<select id="type"><option>网页</option><option>视频</option></select></label><label>标题<input id="title" required placeholder="填写资料名称"></label><label>主题<input id="topic" placeholder="例如：语音 Agent"></label><label>提取状态<select id="status"><option>待处理</option><option>已提取</option><option>提取不完整</option><option>需补充</option></select></label><label>内容与笔记<textarea id="content" placeholder="粘贴正文、字幕或经过核实的整理内容"></textarea></label><p class="hint">正文与字幕保存在本机。状态由你手动设置。</p><div class="buttons"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog><script>
(()=>{'use strict';const key='taskarchive.materials.v1',$=id=>document.getElementById(id);let items=[],selected=null,editing=null;function node(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function valid(x){try{let u=new URL(x);return u.protocol==='https:'||u.protocol==='http:'}catch{return false}}function save(a){try{localStorage.setItem(key,JSON.stringify(a));items=a;return true}catch(e){alert('保存失败，请检查浏览器存储空间。');return false}}function read(){try{let x=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(x))throw Error();items=x}catch(e){$('reader').textContent='读取本机资料失败，原数据未被覆盖。'}}function render(){let q=$('search').value.toLowerCase().trim(),filter=$('filter').value,arr=items.filter(x=>(!filter||x.type===filter)&&[x.title,x.topic,x.url,x.content].some(v=>String(v||'').toLowerCase().includes(q)));let list=$('list');list.replaceChildren();if(!arr.length)list.append(node('p',items.length?'没有找到资料':'还没有资料','hint'));if(!items.some(x=>x.id===selected))selected=items[0]?.id||null;arr.forEach(x=>{let b=node('button',undefined,'item'+(x.id===selected?' active':''));b.append(node('strong',x.title),node('small',`${x.type} · ${x.status} · ${x.topic||'未分类'}`));b.onclick=()=>{selected=x.id;render()};list.append(b)});let reader=$('reader');reader.replaceChildren();let x=items.find(x=>x.id===selected);if(!x){reader.append(node('p','添加网页或视频链接，建立你的资料集。','hint'));return}reader.append(node('p',`${x.type} / ${x.topic||'未分类'}`,'meta'),node('h2',x.title),node('span',x.status,'status'));let a=node('a','查看原始资料','link');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';let link=node('p');link.append(a);reader.append(link,node('h3','内容与笔记'),node('p',x.content||'暂无内容，可编辑后粘贴正文、字幕或整理结果。','hint'));if(x.error)reader.append(node('p','提取说明：'+x.error,'hint'));if(Array.isArray(x.images)&&x.images.length){reader.append(node('h3','原文图片'));x.images.forEach(img=>{if(!img||!valid(img.url))return;let a=node('a',img.alt||'查看原图','link');a.href=img.url;a.target='_blank';a.rel='noopener noreferrer';let p=node('p');p.append(a);reader.append(p)})}let knowledge=node('a','前往知识库','link');knowledge.href='./knowledge.html';reader.append(knowledge);let edit=node('button','编辑资料');edit.onclick=()=>open(x);let del=node('button','删除');del.className='danger';del.onclick=()=>{if(confirm('删除本机保存的这条资料？')&&save(items.filter(y=>y.id!==x.id))){selected=null;render()}};let actions=node('div',undefined,'actions');actions.append(edit,del);reader.append(actions)}function open(x){editing=x||null;$('form').reset();for(let k of ['url','type','title','topic','status','content'])$(k).value=x?.[k]||({type:'网页',status:'待处理'}[k]||'');$('form-title').textContent=x?'编辑资料':'添加资料';$('editor').showModal()}$('add').onclick=()=>open();$('cancel').onclick=()=>$('editor').close();$('search').oninput=render;$('filter').onchange=render;$('form').onsubmit=e=>{e.preventDefault();let url=$('url').value.trim();if(!valid(url)){alert('请输入有效的 http 或 https 链接');return}if(items.some(x=>x.url===url&&x.id!==editing?.id)){alert('这条链接已存在。');return}let x={id:editing?.id||crypto.randomUUID(),createdAt:editing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};for(let k of ['url','type','title','topic','status','content'])x[k]=$(k).value.trim();if(editing?.images)x.images=editing.images;if(editing?.error)x.error=editing.error;if(save([...items.filter(y=>y.id!==x.id),x])){selected=x.id;$('editor').close();render()}};$('export').onclick=()=>{let a=node('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,items},null,2)],{type:'application/json'}));a.download='taskarchive-materials-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!Array.isArray(data.items)||data.items.some(x=>!x||typeof x.id!=='string'||typeof x.title!=='string'||!valid(x.url)||!['网页','视频'].includes(x.type)))throw Error('备份格式不正确');let merged=new Map(items.map(x=>[x.id,x]));data.items.forEach(x=>{let old=merged.get(x.id);if(!old||String(x.updatedAt)>String(old.updatedAt))merged.set(x.id,x)});if(save([...merged.values()]))render()}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};read();render()})();
</script></body></html>
