<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料集 · TaskArchive</title><style>
:root{--bg:#f8f7f4;--ink:#222c3d;--muted:#79818c;--line:#e2e3e1;--blue:#344d78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--blue)}.top{max-width:1380px;margin:auto;padding:24px 44px 0;display:flex;gap:28px;color:#718093}.top a{text-decoration:none;color:inherit}.top a[aria-current]{color:var(--blue);font-weight:650;border-bottom:2px solid var(--blue);padding-bottom:9px}.shell{max-width:1380px;margin:auto;padding:35px 44px}.quick{display:flex;gap:8px;margin:24px 0 12px}.quick input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:10px;background:#fff}.quick button{background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:8px;padding:9px 16px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);background:#fff;border:1px solid var(--line);border-radius:12px;min-height:70vh;overflow:hidden}.sidebar{background:#f5f5f2;border-right:1px solid var(--line);padding:16px 12px;min-width:0}.item{display:block;text-align:left;width:100%;min-width:0;border:0;border-radius:7px;background:transparent;padding:10px 11px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}.item:hover{background:#eaedf0}.item.active{background:#e4eaf3;color:#29436e}.group{margin:4px 0}.group summary{cursor:pointer;padding:8px 10px;font-weight:600;color:#515b6a}.group .item{padding-left:25px}.reader{min-width:0;display:flex;flex-direction:column}.viewer{width:100%;flex:1;min-height:70vh;border:0;background:white}.fallback{padding:9px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.fallback a{margin-left:6px}.empty{padding:32px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:700px){.top{padding:18px 20px 0}.shell{padding:24px 16px}.layout{grid-template-columns:minmax(100px,32%) minmax(0,1fr)}.sidebar{padding:10px 5px}.item{padding:9px 7px}.fallback{padding:9px}.viewer{min-height:65vh}}
</style></head><body><nav class="top" aria-label="主要页面"><a href="./index.html">任务档案</a><a href="./knowledge.html">知识库</a><a href="./materials.html" aria-current="page">资料集</a></nav><div class="shell"><form id="quick" class="quick"><input id="url" type="url" placeholder="粘贴网页或视频链接" aria-label="网页或视频链接" required><button type="submit">保存</button></form><div id="layout" class="layout" hidden><aside class="sidebar" aria-label="资料目录"><div id="list"></div></aside><main id="reader" class="reader"></main></div></div><script>
(()=>{'use strict';const key='taskarchive.materials.v1',$=id=>document.getElementById(id);let items=[],selected=null;function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function valid(s){try{return ['http:','https:'].includes(new URL(s).protocol)}catch{return false}}function save(next){try{localStorage.setItem(key,JSON.stringify(next));items=next;return true}catch(e){alert('保存失败，请检查浏览器存储空间。');return false}}function name(x){try{let h=new URL(x.url).hostname.replace(/^www\./,'');return !x.title||x.title===h||x.title==='www.'+h?x.url:x.title}catch{return x.title||x.url||'未命名资料'}}function embed(url){let u=new URL(url),h=u.hostname.toLowerCase(),id;if(h==='youtu.be')id=u.pathname.split('/')[1];else if(h==='youtube.com'||h.endsWith('.youtube.com'))id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed)\/([^/]+)/)?.[1];if(id&&/^[\w-]{11}$/.test(id))return 'https://www.youtube.com/embed/'+id;let bv=u.pathname.match(/\/(BV[0-9A-Za-z]{10})(?:\/|$)/i)?.[1];if((h==='bilibili.com'||h.endsWith('.bilibili.com'))&&bv)return 'https://player.bilibili.com/player.html?bvid='+encodeURIComponent(bv);return url}function render(){ $('layout').hidden=!items.length;let list=$('list');list.replaceChildren();if(!items.length){$('reader').replaceChildren();return}if(!items.some(x=>x.id===selected))selected=items[0].id;let groups=new Map();for(let x of items){let topic=typeof x.topic==='string'?x.topic.trim():'';if(topic)groups.set(topic,(groups.get(topic)||0)+1)}let containers=new Map();for(let x of items){let topic=typeof x.topic==='string'?x.topic.trim():'';let parent=list;if(topic&&groups.get(topic)>1){if(!containers.has(topic)){let d=el('details',undefined,'group');d.open=true;d.append(el('summary',topic));list.append(d);containers.set(topic,d)}parent=containers.get(topic)}let b=el('button',name(x),'item'+(x.id===selected?' active':''));b.type='button';b.title=name(x);b.onclick=()=>{selected=x.id;render()};parent.append(b)}let x=items.find(y=>y.id===selected),reader=$('reader');reader.replaceChildren();if(!valid(x.url)){reader.append(el('p','链接无效','empty'));return}let frame=el('iframe',undefined,'viewer');frame.title=name(x);frame.referrerPolicy='strict-origin-when-cross-origin';frame.setAttribute('allow','fullscreen; picture-in-picture');frame.allowFullscreen=true;frame.src=embed(x.url);let foot=el('div','若页面没有显示，可能是来源网站不允许嵌入。','fallback');let a=el('a','打开原始链接');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';foot.append(a);reader.append(frame,foot)}$('quick').onsubmit=e=>{e.preventDefault();let url=$('url').value.trim();if(!valid(url)){alert('请输入有效的网址');return}let old=items.find(x=>x.url===url);if(old){selected=old.id;$('url').value='';render();return}let now=new Date().toISOString(),x={id:crypto.randomUUID(),url,title:url,topic:'',type:'网页',status:'待处理',content:'',createdAt:now,updatedAt:now};if(!save([...items,x]))return;selected=x.id;$('url').value='';render();let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);fetch(url,{signal:controller.signal,credentials:'omit'}).then(r=>{if(!r.ok||!(r.headers.get('content-type')||'').includes('text/html'))throw Error();return r.text()}).then(text=>{let d=new DOMParser().parseFromString(text,'text/html'),title=(d.querySelector('meta[property="og:title"]')?.content||d.title||'').trim().slice(0,300),old=items.find(y=>y.id===x.id);if(!old||old.title!==url||!title)return;if(save(items.map(y=>y.id===x.id?{...y,title,updatedAt:new Date().toISOString()}:y)))render()}).catch(()=>{}).finally(()=>clearTimeout(timer))};try{let x=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(x))items=x}catch(e){}render()})();
</script><script src="./materials-ai.js"></script></body></html>
