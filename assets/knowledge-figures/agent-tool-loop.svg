<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 670" role="img" aria-labelledby="title desc"><title id="title">Agent 从请求到工具调用的运行闭环</title><desc id="desc">用户提出目标，模型结合指令、上下文和工具定义决定直接回答或发起工具调用。运行时校验参数与权限并执行工具，将结果返回模型，模型继续推理并最终回复。MCP 可在运行时与外部工具间提供标准化接入，Skill 提供可复用的任务说明与工作流程。</desc><rect width="1160" height="670" rx="22" fill="#f6f8fb"/><g font-family="sans-serif" fill="#223650"><text x="48" y="57" font-size="31" font-weight="700">Agent 的运行闭环</text><text x="48" y="88" font-size="17" fill="#64748b">概念架构 · 工具调用是模型决策与外部执行的组合，不等于模型直接操作外部系统</text></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#607da0"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="155" width="210" height="95" rx="15" fill="#dfeafa" stroke="#9db8d9"/><text x="150" y="195" font-size="23" font-weight="700" fill="#213c60">用户目标</text><text x="150" y="224" font-size="16" fill="#4b6481">请求 / 输入 / 限制</text><rect x="320" y="155" width="250" height="95" rx="15" fill="#e5e7fa" stroke="#a4add9"/><text x="445" y="195" font-size="23" font-weight="700" fill="#333b74">模型决策</text><text x="445" y="224" font-size="16" fill="#5a6189">上下文 + 工具定义</text><rect x="635" y="155" width="240" height="95" rx="15" fill="#e5f3ee" stroke="#9ccab6"/><text x="755" y="195" font-size="22" font-weight="700" fill="#285c48">运行时校验</text><text x="755" y="224" font-size="16" fill="#497565">参数 / 权限 / 超时</text><rect x="920" y="155" width="195" height="95" rx="15" fill="#e5f3ee" stroke="#9ccab6"/><text x="1018" y="195" font-size="22" font-weight="700" fill="#285c48">外部工具</text><text x="1018" y="224" font-size="16" fill="#497565">API / 数据 / 操作</text><rect x="355" y="365" width="430" height="95" rx="15" fill="#fff" stroke="#b6c4d3"/><text x="570" y="405" font-size="23" font-weight="700" fill="#213c60">工具结果 → 模型继续判断</text><text x="570" y="434" font-size="16" fill="#63758a">可继续调用工具，或生成最终回答</text><rect x="45" y="365" width="210" height="95" rx="15" fill="#dfeafa" stroke="#9db8d9"/><text x="150" y="405" font-size="23" font-weight="700" fill="#213c60">最终回复</text><text x="150" y="434" font-size="16" fill="#4b6481">答案 / 产物 / 状态</text></g><g stroke="#607da0" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M255 202H318"/><path d="M570 202H633"/><path d="M875 202H918"/><path d="M1018 252V311H570V363"/><path d="M355 413H257"/><path d="M570 365V295H445V252" stroke-dasharray="8 7"/></g><g font-family="sans-serif" fill="#526985" font-size="16"><text x="693" y="299">返回执行结果</text><text x="475" y="288">按需继续循环</text><rect x="55" y="525" width="1050" height="100" rx="14" fill="#edf1f6"/><text x="85" y="560" font-weight="700" fill="#2b415e">MCP</text><text x="160" y="560">：为工具与资源提供标准化发现及调用接口；可位于运行时与工具之间</text><text x="85" y="599" font-weight="700" fill="#2b415e">Skill</text><text x="160" y="599">：可复用的任务说明、知识与步骤；不等同于 API 或 MCP 协议</text></g></svg>