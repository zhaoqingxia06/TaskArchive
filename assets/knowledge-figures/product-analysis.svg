<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" role="img" aria-labelledby="t d"><title id="t">产品拆解的六个视角</title><desc id="d">定位、用户场景、功能架构、商业模式、增长和机会应围绕研究问题与证据选择重点。</desc><rect width="840" height="240" rx="16" fill="#f3f5f8"/><g font-family="sans-serif" fill="#263e60" text-anchor="middle"><text x="420" y="34" font-size="20" font-weight="bold">围绕具体问题，选择拆解视角</text><g font-size="16"><rect x="30" y="58" width="235" height="55" rx="8" fill="#dce8f3"/><text x="147" y="92">定位：解决什么问题</text><rect x="302" y="58" width="235" height="55" rx="8" fill="#dce8f3"/><text x="419" y="92">用户：谁在何种场景</text><rect x="575" y="58" width="235" height="55" rx="8" fill="#dce8f3"/><text x="692" y="92">功能：如何交付价值</text><rect x="30" y="126" width="235" height="55" rx="8" fill="#e8e1f3"/><text x="147" y="160">商业：价值如何持续</text><rect x="302" y="126" width="235" height="55" rx="8" fill="#e8e1f3"/><text x="419" y="160">增长：如何获得和留住</text><rect x="575" y="126" width="235" height="55" rx="8" fill="#e8e1f3"/><text x="692" y="160">机会：条件与验证</text></g><text x="420" y="215" font-size="13">原创结构图 · 每个判断都要区分事实、宣称、推断与未知</text></g></svg>
