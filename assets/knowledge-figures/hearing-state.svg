<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" role="img" aria-labelledby="t d"><title id="t">听力辅助的四层状态</title><desc id="d">数据保存、用户配置、设备执行和用户体验需要分别确认。</desc><rect width="840" height="200" rx="16" fill="#f3f5f8"/><g font-family="sans-serif" fill="#263e60" text-anchor="middle"><text x="420" y="32" font-size="20" font-weight="bold">数据存在不等于设备已生效</text><g font-size="16"><rect x="20" y="60" width="180" height="67" rx="9" fill="#dce8f3"/><text x="110" y="87">数据已保存</text><text x="110" y="108" font-size="13">结果 · 来源 · 日期</text><text x="215" y="100" font-size="22">→</text><rect x="230" y="60" width="180" height="67" rx="9" fill="#dce8f3"/><text x="320" y="87">配置已选择</text><text x="320" y="108" font-size="13">哪份结果 · 哪台设备</text><text x="425" y="100" font-size="22">→</text><rect x="440" y="60" width="180" height="67" rx="9" fill="#e8e1f3"/><text x="530" y="87">设备已执行</text><text x="530" y="108" font-size="13">接收 · 生效 · 失败</text><text x="635" y="100" font-size="22">→</text><rect x="650" y="60" width="170" height="67" rx="9" fill="#e8e1f3"/><text x="735" y="87">用户体验</text><text x="735" y="108" font-size="13">场景效果 · 舒适度</text></g><text x="420" y="164" font-size="13">原创产品概念图 · 各环节的具体实现与状态依据因设备而异</text></g></svg>
