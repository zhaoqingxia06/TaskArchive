<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">标准纯音听力图的示例及符号图例</title><desc id="d">依据 ASHA 测听图坐标及气导符号规范原创重绘。横轴频率125至8000赫兹，纵轴听力级负10至100 dB HL。红色空心圆表示右耳未掩蔽气导，蓝色叉表示左耳未掩蔽气导。曲线为虚构示例，不能用于诊断。</desc><rect width="1100" height="760" fill="#fff"/><g font-family="Arial, sans-serif" fill="#25354a"><text x="50" y="48" font-size="29" font-weight="700">纯音听力图 · 坐标与气导符号</text><text x="50" y="78" font-size="17" fill="#65758b">依据 ASHA 规范重绘 · 所有阈值均为教学虚构数据，非真实患者报告</text></g><line x1="130" y1="130" x2="880" y2="130" stroke="#d9e2eb"/><text x="110" y="136" text-anchor="end" font-size="17" fill="#4c6077">-10</text><line x1="130" y1="171" x2="880" y2="171" stroke="#d9e2eb"/><text x="110" y="177" text-anchor="end" font-size="17" fill="#4c6077">0</text><line x1="130" y1="212" x2="880" y2="212" stroke="#d9e2eb"/><text x="110" y="218" text-anchor="end" font-size="17" fill="#4c6077">10</text><line x1="130" y1="253" x2="880" y2="253" stroke="#d9e2eb"/><text x="110" y="259" text-anchor="end" font-size="17" fill="#4c6077">20</text><line x1="130" y1="294" x2="880" y2="294" stroke="#d9e2eb"/><text x="110" y="300" text-anchor="end" font-size="17" fill="#4c6077">30</text><line x1="130" y1="335" x2="880" y2="335" stroke="#d9e2eb"/><text x="110" y="341" text-anchor="end" font-size="17" fill="#4c6077">40</text><line x1="130" y1="376" x2="880" y2="376" stroke="#d9e2eb"/><text x="110" y="382" text-anchor="end" font-size="17" fill="#4c6077">50</text><line x1="130" y1="417" x2="880" y2="417" stroke="#d9e2eb"/><text x="110" y="423" text-anchor="end" font-size="17" fill="#4c6077">60</text><line x1="130" y1="458" x2="880" y2="458" stroke="#d9e2eb"/><text x="110" y="464" text-anchor="end" font-size="17" fill="#4c6077">70</text><line x1="130" y1="498.99999999999994" x2="880" y2="498.99999999999994" stroke="#d9e2eb"/><text x="110" y="504.99999999999994" text-anchor="end" font-size="17" fill="#4c6077">80</text><line x1="130" y1=