<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" aria-labelledby="t d"><title id="t">硬件产品：从机会到持续交付</title><desc id="d">每一阶段形成证据后决策；发现问题时可能回退</desc><rect width="1100" height="490" rx="20" fill="#f6f8fb"/><g font-family="sans-serif"><text x="42" y="54" font-size="29" font-weight="700" fill="#223650">硬件产品：从机会到持续交付</text><text x="42" y="88" font-size="17" fill="#526985">每一阶段形成证据后决策；发现问题时可能回退</text><rect x="42" y="110" width="1016" height="70" rx="9" fill="white" stroke="#cad7e4"/><rect x="42" y="110" width="188" height="70" rx="9" fill="#e1edfa"/><text x="135" y="154" text-anchor="middle" font-size="23" font-weight="700" fill="#24436a">机会与定义</text><text x="258" y="154" font-size="21" fill="#344c69">问题、用户、目标与方案</text><rect x="42" y="196" width="1016" height="70" rx="9" fill="white" stroke="#cad7e4"/><rect x="42" y="196" width="188" height="70" rx="9" fill="#e1edfa"/><text x="135" y="240" text-anchor="middle" font-size="23" font-weight="700" fill="#24436a">立项与开发</text><text x="258" y="240" font-size="21" fill="#344c69">成本、技术、样机与验证</text><rect x="42" y="282" width="1016" height="70" rx="9" fill="white" stroke="#cad7e4"/><rect x="42" y="282" width="188" height="70" rx="9" fill="#e1edfa"/><text x="135" y="326" text-anchor="middle" font-size="23" font-weight="700" fill="#24436a">量产与上市</text><text x="258" y="326" font-size="21" fill="#344c69">供应、质量、渠道与服务</text><rect x="42" y="368" width="1016" height="70" rx="9" fill="white" stroke="#cad7e4"/><rect x="42" y="368" width="188" height="70" rx="9" fill="#e1edfa"/><text x="135" y="412" text-anchor="middle" font-size="23" font-weight="700" fill="#24436a">上市后</text><text x="258" y="412" font-size="21" fill="#344c69">真实使用、经营与迭代</text></g></svg>