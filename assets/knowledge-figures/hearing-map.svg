<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">听觉能力与声音场景的关系</title><desc id="desc">听力阈值、不同声音特征、环境与人共同影响是否听见和理解；箭头展示判断流程，本图不表示定量阈值。</desc>
<rect width="1200" height="540" rx="30" fill="#f2f5f8"/><text x="52" y="69" font-size="30" fill="#20395e" font-family="sans-serif" font-weight="700">听见什么，取决于多个因素共同作用</text><text x="53" y="104" font-size="18" fill="#66788e" font-family="sans-serif">概念示意 · 不代表实际声级、频率或个体预测</text>
<g font-family="sans-serif" fill="#263952"><rect x="52" y="145" width="324" height="290" rx="18" fill="#fff"/><rect x="438" y="145" width="324" height="290" rx="18" fill="#fff"/><rect x="824" y="145" width="324" height="290" rx="18" fill="#fff"/><text x="77" y="193" font-size="24" font-weight="700">① 人的听觉特征</text><text x="77" y="240" font-size="20">• 左右耳听阈与曲线</text><text x="77" y="281" font-size="20">• 言语辨识与空间听觉</text><text x="77" y="322" font-size="20">• 声音耐受、疲劳等</text><text x="77" y="375" font-size="17" fill="#6a7d94">同一个分级，表现也不同</text><text x="463" y="193" font-size="24" font-weight="700">② 声音与环境</text><text x="463" y="240" font-size="20">• 强弱、频率、持续时间</text><text x="463" y="281" font-size="20">• 距离、遮挡、方向</text><text x="463" y="322" font-size="20">• 噪声、混响、竞争声</text><text x="463" y="375" font-size="17" fill="#6a7d94">同一种声音，响度会变化</text><text x="849" y="193" font-size="24" font-weight="700">③ 真实任务</text><text x="849" y="240" font-size="20">• 察觉：有没有声音？</text><text x="849" y="281" font-size="20">• 辨认：是什么声音？</text><text x="849" y="322" font-size="20">• 理解／定位／采取行动</text><text x="849" y="375" font-size="17" fill="#6a7d94">听得到，不等于听得懂</text></g><path d="M389 284h31m-8-8 9 8-9 8M775 284h31m-8-8 9 8-9 8" fill="none" stroke="#6380a4" stroke-width="4"/><text x="53" y="491" font-size="17" fill="#66788e" font-family="sans-serif">基于 ASHA、NIDCD 的听阈与言语理解说明绘制；用于学习，不替代个体测评。</text></svg>
