<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" role="img" aria-labelledby="t d"><title id="t">旅行助手的任务链</title><desc id="d">需求、研究、用户决策、预订和后续服务构成体验链；权限、实时性与责任贯穿各环节。</desc><rect width="840" height="200" rx="16" fill="#f3f5f8"/><g font-family="sans-serif" fill="#263e60" text-anchor="middle"><text x="420" y="32" font-size="20" font-weight="bold">旅行助手：从需求到后续服务</text><g font-size="15"><rect x="18" y="62" width="138" height="58" rx="8" fill="#dce8f3"/><text x="87" y="97">表达需求</text><text x="171" y="98">→</text><rect x="185" y="62" width="138" height="58" rx="8" fill="#dce8f3"/><text x="254" y="97">研究与比较</text><text x="338" y="98">→</text><rect x="352" y="62" width="138" height="58" rx="8" fill="#e3e9f2"/><text x="421" y="97">用户决策</text><text x="505" y="98">→</text><rect x="519" y="62" width="138" height="58" rx="8" fill="#e8e1f3"/><text x="588" y="97">预订与确认</text><text x="672" y="98">→</text><rect x="686" y="62" width="138" height="58" rx="8" fill="#e8e1f3"/><text x="755" y="97">变更与服务</text></g><text x="420" y="157" font-size="13">原创分析框架 · 权限、库存时效、失败恢复与责任贯穿各环节</text></g></svg>
