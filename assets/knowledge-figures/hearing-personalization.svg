<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 205" role="img" aria-labelledby="t d"><title id="t">从听力图到使用效果</title><desc id="d">听力数据和用户需求用于确定处方目标，设备执行处理；真耳测量检查输出，真实使用评估效果。</desc><rect width="860" height="205" rx="16" fill="#f3f5f8"/><g font-family="sans-serif" fill="#263e60" text-anchor="middle"><text x="430" y="30" font-size="20" font-weight="bold">从输入到效果：四个不同层次</text><g font-size="16"><rect x="20" y="55" width="175" height="70" rx="10" fill="#dce8f3"/><text x="107" y="83">听力数据与需求</text><text x="107" y="108" font-size="13">耳别 · 频率 · 场景</text><text x="215" y="96" font-size="24">→</text><rect x="235" y="55" width="175" height="70" rx="10" fill="#dce8f3"/><text x="322" y="83">处方目标</text><text x="322" y="108" font-size="13">频率与输入声级</text><text x="430" y="96" font-size="24">→</text><rect x="450" y="55" width="175" height="70" rx="10" fill="#e8e1f3"/><text x="537" y="83">设备实际输出</text><text x="537" y="108" font-size="13">声学测量验证</text><text x="645" y="96" font-size="24">→</text><rect x="665" y="55" width="175" height="70" rx="10" fill="#e8e1f3"/><text x="752" y="83">真实使用效果</text><text x="752" y="108" font-size="13">任务 · 舒适 · 场景</text></g><text x="430" y="158" font-size="14">每一步都需验证；听阈、目标增益与实际耳内声压不是同一个量</text><text x="430" y="182" font-size="12">原创概念图 · 参考 ASHA 成人助听器选配与验证资料</text></g></svg>
