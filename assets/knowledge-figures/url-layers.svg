<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" role="img" aria-labelledby="t d"><title id="t">链接能提供的信息分层</title><desc id="d">地址结构可直接解析；网页信息需要访问；摘要判断需要分析已获得的资料。</desc><rect width="840" height="210" rx="16" fill="#f3f5f8"/><g font-family="sans-serif" fill="#263e60" text-anchor="middle"><text x="420" y="35" font-size="21" font-weight="bold">链接能提供的信息分层</text><rect x="25" y="65" width="230" height="83" rx="10" fill="#dce8f3"/><text x="140" y="96" font-size="17">URL 字符串</text><text x="140" y="123" font-size="14">主机 · 路径 · 参数</text><text x="275" y="110" font-size="24">→</text><rect x="305" y="65" width="230" height="83" rx="10" fill="#e3e9f2"/><text x="420" y="96" font-size="17">访问网页</text><text x="420" y="123" font-size="14">响应 · 正文 · 元数据</text><text x="555" y="110" font-size="24">→</text><rect x="585" y="65" width="230" height="83" rx="10" fill="#e8e1f3"/><text x="700" y="96" font-size="17">基于资料分析</text><text x="700" y="123" font-size="14">摘要 · 分类 · 推断</text><text x="420" y="183" font-size="13">后一层依赖实际获取的内容；缺失或冲突应明确标注</text></g></svg>
