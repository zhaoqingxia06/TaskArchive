<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 205" role="img" aria-labelledby="t d"><title id="t">评价产品的三个判断</title><desc id="d">用户价值、体验质量和持续交付共同影响产品是否有效；指标须分别验证。</desc><rect width="840" height="205" rx="16" fill="#f3f5f8"/><g font-family="sans-serif" fill="#263e60" text-anchor="middle"><text x="420" y="36" font-size="21" font-weight="bold">评价产品：三个互相约束的判断</text><rect x="25" y="64" width="245" height="85" rx="10" fill="#dce8f3"/><text x="147" y="96" font-size="18">用户价值</text><text x="147" y="123" font-size="14">问题是否重要，结果是否改善</text><rect x="297" y="64" width="245" height="85" rx="10" fill="#e2e9f2"/><text x="419" y="96" font-size="18">体验质量</text><text x="419" y="123" font-size="14">能否顺利、可靠地获得结果</text><rect x="570" y="64" width="245" height="85" rx="10" fill="#e8e1f3"/><text x="692" y="96" font-size="18">持续交付</text><text x="692" y="123" font-size="14">成本、能力与回报能否持续</text><text x="420" y="181" font-size="13">原创综合框架 · 三者并行验证，不是统一评分公式</text></g></svg>
