<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="path-title path-desc"><title id="path-title">从振动到听见：声音与听觉的路径</title><desc id="path-desc">物体振动产生声波，声波经空气进入外耳道，使鼓膜和听小骨振动；内耳耳蜗将振动转为神经信号，经听觉神经传至大脑形成听觉感知。</desc><rect width="1200" height="500" rx="18" fill="#f6f8fb"/><g font-family="sans-serif" fill="#233b5c"><text x="48" y="54" font-size="30" font-weight="700">从振动到听见</text><text x="48" y="85" font-size="17" fill="#596e86">声音产生与传播 → 耳朵接收与转换 → 大脑感知</text></g><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#607d9f"/></marker></defs><g stroke="#607d9f" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M260 178 H306"/><path d="M555 178 H601"/><path d="M850 178 H896"/><path d="M1020 222 V253 H180 V292"/><path d="M260 337 H306"/><path d="M555 337 H601"/><path d="M850 337 H896"/></g><g font-family="sans-serif" text-anchor="middle"><g fill="#ffffff" stroke="#b8c9d9"><rect x="40" y="132" width="220" height="90" rx="10"/><rect x="310" y="132" width="245" height="90" rx="10"/><rect x="605" y="132" width="245" height="90" rx="10"/><rect x="900" y="132" width="240" height="90" rx="10"/><rect x="40" y="292" width="220" height="90" rx="10"/><rect x="310" y="292" width="245" height="90" rx="10"/><rect x="605" y="292" width="245" height="90" rx="10"/><rect x="900" y="292" width="240" height="90" rx="10"/></g><g fill="#243f61" font-size="22" font-weight="700"><text x="150" y="166">① 物体振动</text><text x="432" y="166">② 声波传播</text><text x="727" y="166">③ 外耳道</text><text x="1020" y="166">④ 鼓膜</text><text x="150" y="326">⑤ 听小骨</text><text x="432" y="326">⑥ 耳蜗</text><text x="727" y="326">⑦ 听觉神经</text><text x="1020" y="326">⑧ 大脑</text></g><g fill="#5c6f84" font-size="16"><text x="150" y="196">产生声音</text><text x="432" y="196">通过空气传播</text><text x="727" y="196">引导声波进入</text><text x="1020" y="196">声波使其振动</text><text x="150" y="356">传递振动至内耳</text><text x="432" y="356">振动转为神经信号</text><text x="727" y="356">传递神经信号</text><text x="1020" y="356">形成听觉感知</text></g></g><text x="48" y="451" font-family="sans-serif" font-size="16" fill="#5c6f84">说明：耳蜗位于内耳；图展示空气传导的简化过程。依据 NIH / NIDCD 资料绘制。</text></svg>
