<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" role="img" aria-labelledby="t d">
<title id="t">手动纯音听阈测量：上升法</title><desc id="d">从预计阈值以下呈现，未听到升五分贝，听到降十分贝并再次上升，重复判定。</desc>
<rect width="900" height="190" rx="16" fill="#f3f5f8"/><g font-family="sans-serif" text-anchor="middle" fill="#263e60"><text x="450" y="32" font-size="20" font-weight="bold">手动纯音测听：一个频率的上升法</text><rect x="30" y="60" width="175" height="58" rx="10" fill="#dce8f3"/><text x="117" y="94" font-size="16">预计阈值以下开始</text><text x="225" y="96" font-size="24">→</text><rect x="245" y="60" width="175" height="58" rx="10" fill="#dce8f3"/><text x="332" y="94" font-size="16">未听到：升 5 dB</text><text x="440" y="96" font-size="24">→</text><rect x="460" y="60" width="175" height="58" rx="10" fill="#e8e1f3"/><text x="547" y="94" font-size="16">听到：降 10 dB</text><text x="655" y="96" font-size="24">→</text><rect x="675" y="60" width="195" height="58" rx="10" fill="#e8e1f3"/><text x="772" y="94" font-size="16">再次上升，重复判定</text><text x="450" y="155" font-size="14">示意图 · 依据 ASHA 2005 手动纯音测听指南；不替代专业操作</text></g></svg>
