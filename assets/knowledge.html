<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库 · TaskArchive</title><style>
:root{--bg:#f8f7f4;--panel:#f1f1ed;--ink:#222c3d;--muted:#79818c;--line:#e2e3e1;--blue:#344d78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #5474ad;outline-offset:2px}.top{max-width:1380px;margin:auto;padding:24px 44px 0;display:flex;gap:28px;color:#718093}.top .search{margin-left:auto;width:min(270px,30vw);align-self:center}.top a[aria-current]{color:var(--blue);font-weight:650;border-bottom:2px solid var(--blue);padding-bottom:9px}.shell{max-width:1380px;margin:0 auto;padding:18px 44px 60px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.head h1{font:700 34px/1.2 Georgia,'Songti SC',serif;letter-spacing:.04em;margin:0 0 8px}.head p{margin:0;color:var(--muted)}.head-actions{display:flex;gap:8px}.small-btn{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.workspace{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:calc(100vh - 105px);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white}.sidebar{background:#f5f5f2;border-right:1px solid var(--line);padding:20px 14px}.search{width:100%;padding:10px 12px;border:1px solid #dddeda;background:#fff;border-radius:8px;outline-color:var(--blue)}.side-caption{font-size:11px;color:#969da5;letter-spacing:.08em;margin:0 9px 8px}.tree details{margin:2px 0}.tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;color:#4a5361;font-weight:600}.tree summary::-webkit-details-marker{display:none}.tree summary:before{content:'›';font-size:17px;line-height:1;color:#8c96a1;transition:transform .15s}.tree details[open]>summary:before{transform:rotate(90deg)}.tree .topic{margin-left:15px}.tree .topic summary{font-weight:500;font-size:13px}.docs{margin:2px 0 6px 30px}.doc-link{width:100%;display:block;text-align:left;border:0;border-radius:6px;padding:8px 10px;background:transparent;color:#6d7785;font-size:12px;line-height:1.45}.doc-link:hover,.tree summary:hover{background:#e9eced}.doc-link.active{color:#29436e;background:#e4eaf3;font-weight:600}.reader{min-width:0;padding:42px clamp(28px,6vw,86px) 70px}.reader-inner{max-width:760px;margin:auto}.breadcrumb{font-size:12px;color:#9299a3;margin-bottom:32px}.reader h1{font-size:30px;line-height:1.35;margin:0 0 12px;letter-spacing:.01em}.meta{font-size:12px;color:#9198a2;margin:0 0 28px}.lead{font-size:15px;line-height:1.9;color:#3f4b5f;padding:18px 20px;background:#f1f4f8;border-radius:8px}.reader h2{font-size:19px;margin:34px 0 12px;padding-bottom:9px;border-bottom:1px solid #e9eae8}.reader p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95;margin:0 0 12px}.reader figure{margin:24px 0;text-align:center}.reader figure img{max-width:100%;height:auto;border:1px solid #e2e3e1;border-radius:8px}.reader figcaption{color:#79818c;font-size:12px;margin-top:7px}.reader .table-wrap{overflow-x:auto;margin:18px 0}.reader table{border-collapse:collapse;width:100%;font-size:13px}.reader th,.reader td{border:1px solid #e2e3e1;padding:9px 12px;text-align:left;vertical-align:top}.reader th{background:#f1f4f8}.reader .note{color:#6e7885;font-size:13px}.reader .article-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:32px}.reader .article-actions button{border:0;background:transparent;padding:5px 0;color:#6c7e9c;margin-right:10px}.empty{color:var(--muted);padding:20px 8px}.coverage{border-top:1px solid var(--line);padding-top:18px;margin-top:36px;color:#98a0a8;font-size:11px;line-height:1.7}.error{color:#a33;font-size:12px}.mobile-label{display:none}dialog{width:min(680px,calc(100% - 28px));max-height:90vh;border:0;border-radius:12px;padding:24px;box-shadow:0 15px 80px #0003}dialog::backdrop{background:#26334577}form{display:grid;gap:10px}label{display:grid;gap:4px;font-size:13px}input,textarea,select{border:1px solid var(--line);border-radius:7px;padding:9px;background:#fff}textarea{min-height:78px;resize:vertical}.dialog-buttons{display:flex;justify-content:flex-end;gap:8px}.dialog-buttons button{border:1px solid var(--line);border-radius:7px;padding:8px 14px}.info{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:700px){.top{padding:18px 20px 0;gap:16px;flex-wrap:wrap}.top .search{width:min(230px,100%);margin-left:auto}.shell{padding:16px 16px 40px}.head{align-items:start}.head h1{font-size:28px}.head p{font-size:12px}.head-actions{flex-wrap:wrap;justify-content:end}.head-actions button{font-size:12px}.workspace{display:block;min-height:0}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px}.mobile-label{display:block;font-size:12px;color:var(--muted);margin:10px 3px}.tree{max-height:260px;overflow:auto}.reader{padding:30px 22px 45px}.reader h1{font-size:25px}.breadcrumb{margin-bottom:20px}.lead{font-size:14px}}
</style></head><body><nav class="top" aria-label="主要页面"><a href="./index.html">任务档案</a><a href="./knowledge.html" aria-current="page">知识库</a><a href="./materials.html">资料集</a><input id="search" class="search" type="search" placeholder="搜索文档、主题或关键词" aria-label="搜索知识"></nav><div class="shell"><div class="workspace"><aside class="sidebar"><p class="side-caption">知识目录</p><p class="mobile-label">展开目录，选择文档阅读</p><div id="tree" class="tree"></div><p id="repoStatus" class="info" role="status">在线知识由 GitHub 仓库维护</p><div id="migration" class="info" hidden></div><p id="error" class="error" role="alert"></p></aside><main class="reader" id="reader"><div class="reader-inner"><p class="empty">正在读取知识…</p></div></main></div></div><dialog id="editor"><form id="form"><h2 id="formTitle">新建文档</h2><p class="info">文档写入 GitHub 仓库后由 GitHub Pages 发布；需要具有该仓库写权限的 GitHub Token，仅在本次页面内存中使用。注意：仓库和网站均为公开内容。</p><label>分类<select id="category" required></select></label><label>主题<input id="topic" required placeholder="如：听力测试与听力图"></label><label>文档标题<input id="title" required></label><label>核心结论<textarea id="summary" required></textarea></label><label>知识与实践<textarea id="body"></textarea></label><label>待验证<textarea id="pending"></textarea></label><label>来源与关联<textarea id="source"></textarea></label><label>关键词<input id="aliases"></label><p id="formError" class="error" role="alert"></p><p class="info">保存后同步到 GitHub，其他设备刷新网页即可看到。切勿把密码、Token 或私密资料发布到公开仓库。</p><div class="dialog-buttons"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog><script>
(()=>{'use strict';
const REPO='zhaoqingxia06/TaskArchive',FILE='data/knowledge.json',LEGACY='taskarchive.knowledge.v1';
const defaults=['语音与 AI','知识与原理','产品与研究方法','产品与案例观察','产品解析','产品方法论','个人成长与生活'];
const fields=['category','topic','title','summary','body','pending','source','aliases'];
const $=id=>document.getElementById(id);
let shared=[],selected=new URLSearchParams(location.hash.replace(/^#/,'')).get('doc'),editing=null,editingText='',credential='',loading=false,loadError='',legacy=[];
const opened=new Set();
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function renderBody(wrap,input){const lines=String(input||'').split(/\r?\n/);let i=0;const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());while(i<lines.length){let line=lines[i].trim();if(!line){i++;continue}let m=line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/);if(m){let url=m[2],allowed=/^https:\/\//i.test(url)||/^data:image\/(?:png|jpeg|webp|gif);base64,[a-z0-9+/=]+$/i.test(url);if(allowed){let fig=node('figure'),img=node('img');img.src=url;img.alt=m[1]||'知识配图';img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>{const note=node('p','图片暂时无法显示：'+img.alt,'note');img.replaceWith(note)};fig.append(img);if(m[1])fig.append(node('figcaption',m[1]));wrap.append(fig)}else wrap.append(node('p','图片地址不可用：'+(m[1]||'知识配图'),'note'));i++;continue}if(line.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1])){let box=node('div',undefined,'table-wrap'),table=node('table'),head=node('tr');cells(line).forEach(t=>head.append(node('th',t)));table.append(head);i+=2;while(i<lines.length&&lines[i].trim().includes('|')){let tr=node('tr');cells(lines[i]).forEach(t=>tr.append(node('td',t)));table.append(tr);i++}box.append(table);wrap.append(box);continue}m=line.match(/^(#{1,4})\s+(.+)$/);if(m){wrap.append(node(m[1].length<=2?'h2':'h3',m[2]));i++;continue}wrap.append(node('p',line));i++}}

function normalize(x){if(x.category==='听力与无障碍'){let t=[x.topic,x.title].join(' ');return {...x,category:/产品|方案|设计|体验|耳机|设备/.test(t)?'产品与案例观察':'知识与原理'}}return x}
function all(){return shared.map(normalize)}
function date(s){let d=new Date(s);return Number.isNaN(d.getTime())?'时间未知':d.toLocaleDateString('zh-CN')}
function inform(msg,isError=false){$('repoStatus').textContent=msg;$('error').textContent=isError?msg:''}
function bodyText(x){return Array.isArray(x.sections)&&x.sections.length?x.sections.map(s=>'## '+s.title+'\n'+(s.paragraphs||[]).join('\n\n')).join('\n\n'):String(x.body||'')}
function render(){
const items=all(),q=$('search').value.trim().toLowerCase();
const found=items.filter(x=>fields.some(k=>String(x[k]||'').toLowerCase().includes(q))||JSON.stringify(x.sections||[]).toLowerCase().includes(q));
if(!selected||!items.some(x=>x.id===selected))selected=items[0]?.id||null;
const tree=$('tree');tree.replaceChildren();
if(!found.length)tree.append(node('p',items.length?'没有找到相关文档':'还没有文档','empty'));
const grouped=new Map();
found.forEach(x=>{const cat=x.category||'待整理',topic=x.topic||'未分类';if(!grouped.has(cat))grouped.set(cat,new Map());let m=grouped.get(cat);if(!m.has(topic))m.set(topic,[]);m.get(topic).push(x)});
grouped.forEach((topics,cat)=>{let d=node('details');d.open=!!q||opened.has('c:'+cat)||[...topics.values()].flat().some(x=>x.id===selected);d.ontoggle=()=>d.open?opened.add('c:'+cat):opened.delete('c:'+cat);d.append(node('summary',cat));
topics.forEach((docs,topic)=>{let t=node('details',undefined,'topic'),key='t:'+cat+'|'+topic;t.open=!!q||opened.has(key)||docs.some(x=>x.id===selected);t.ontoggle=()=>t.open?opened.add(key):opened.delete(key);t.append(node('summary',topic));let list=node('div',undefined,'docs');
docs.forEach(x=>{let b=node('button',x.title,'doc-link'+(x.id===selected?' active':''));b.type='button';b.onclick=()=>{selected=x.id;history.replaceState(null,'','#doc='+encodeURIComponent(selected));render();if(innerWidth<=700)$('reader').scrollIntoView({behavior:'smooth',block:'start'})};list.append(b)});t.append(list);d.append(t)});tree.append(d)});
let x=items.find(v=>v.id===selected),reader=$('reader');reader.replaceChildren();let wrap=node('div',undefined,'reader-inner');
if(!x){wrap.append(node('p',loadError||'暂无在线文档。','empty'));reader.append(wrap);return}
wrap.append(node('div',(x.category||'待整理')+'  /  '+(x.topic||'未分类'),'breadcrumb'),node('h1',x.title),node('p','最近更新 '+date(x.updatedAt),'meta'),node('div',x.summary,'lead'));
if(Array.isArray(x.sections)&&x.sections.length){x.sections.forEach(s=>{wrap.append(node('h2',s.title));(s.paragraphs||[]).forEach(p=>renderBody(wrap,p))})}else if(x.body){wrap.append(node('h2','知识与实践'));renderBody(wrap,x.body)}
if(x.pending)wrap.append(node('h2','待验证'),node('p',x.pending,'note'));
if(x.source||x.references?.length){wrap.append(node('h2','来源与关联'));if(x.source)wrap.append(node('p',x.source,'note'));(x.references||[]).forEach(url=>{try{let u=new URL(url);if(u.protocol==='https:'){let a=node('a',u.hostname+' · 查看原始资料');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.style.cssText='display:block;color:#344d78;margin:7px 0;text-decoration:underline';wrap.append(a)}}catch(e){}})}
let actions=node('div',undefined,'article-actions'),edit=node('button','编辑在线文档');edit.onclick=()=>openEditor(x);actions.append(edit);
let link=node('a','在 GitHub 查看');link.href='https://github.com/'+REPO+'/blob/main/'+FILE;link.target='_blank';link.rel='noopener noreferrer';link.style.cssText='color:#344d78;text-decoration:underline';actions.append(link);
wrap.append(actions,node('div','正式数据保存在 GitHub 仓库 · 公开知识库 · 编辑须有写权限','coverage'));reader.append(wrap)
}
function populate(){let select=$('category');select.replaceChildren();[...new Set([...defaults,...shared.map(x=>x.category).filter(Boolean)])].forEach(c=>{let opt=node('option',c);opt.value=c;select.append(opt)})}
function openEditor(x){editing=x||null;editingText=x?bodyText(x):'';$('form').reset();$('formError').textContent='';fields.forEach(k=>$(k).value=k==='body'?editingText:x?.[k]||'');if(!x)$('category').value='产品方法论';$('formTitle').textContent=x?'编辑在线文档':'新建在线文档';$('editor').showModal()}
function getToken(){
if(credential)return credential;
const value=window.prompt('请输入拥有 TaskArchive 仓库 Contents 读写权限的 GitHub fine-grained token。\nToken 仅保留在当前网页内存，刷新后清除，不会写入知识文档。\n请勿使用高权限或永久 Token。');
if(!value)return null;
credential=value.trim();return credential
}
function encodeUtf8(value){let bytes=new TextEncoder().encode(value),out='';for(let i=0;i<bytes.length;i+=8192)out+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(out)}
function decodeUtf8(value){return new TextDecoder().decode(Uint8Array.from(atob(value.replace(/\s/g,'')),c=>c.charCodeAt(0)))}
async function gitRead(token){let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE+'?ref=main',{headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error('GitHub 文件读取失败（HTTP '+r.status+'），请检查 Token 权限');let f=await r.json(),data=JSON.parse(decodeUtf8(f.content));if(data.version!==1||!Array.isArray(data.items))throw Error('在线数据格式不符合预期');return {sha:f.sha,data}}
async function gitWrite(sha,data,token,message){let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE,{method:'PUT',headers:{Accept:'application/vnd.github+json','Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({message,content:encodeUtf8(JSON.stringify(data,null,2)+'\n'),sha,branch:'main'})});if(!r.ok){let result=await r.json().catch(()=>({}));throw Error('GitHub 写入失败（HTTP '+r.status+'）：'+(result.message||'请检查权限，或刷新后重试'))}return r.json()}
async function saveItems(make,commitMessage){
if(loading)return false;const token=getToken();if(!token)return false;
loading=true;inform('正在读取 GitHub 最新版本并保存…');
try{const original=await gitRead(token),next=make(original.data);if(!next)return false;
await gitWrite(original.sha,next,token,commitMessage);
shared=next.items;populate();render();inform('已写入 GitHub；GitHub Pages 部署完成后，各设备刷新即可看到。');return true
}catch(e){inform(String(e.message||e),true);alert('保存未完成：'+String(e.message||e));return false}finally{loading=false}
}
$('search').oninput=render;$('cancel').onclick=()=>$('editor').close();
$('form').onsubmit=async event=>{
event.preventDefault();const now=new Date().toISOString(),x={...(editing||{}),id:editing?.id||crypto.randomUUID(),createdAt:editing?.createdAt||now,updatedAt:now};
fields.forEach(key=>x[key]=$(key).value.trim());
if(!x.topic||!x.title||!x.summary){$('formError').textContent='请填写主题、标题与核心结论。';return}
if(editing&&x.body===editingText&&Array.isArray(editing.sections))x.sections=editing.sections;else delete x.sections;
const btn=$('form').querySelector('button[type=submit]');btn.disabled=true;btn.textContent='正在保存…';
const ok=await saveItems(data=>{
let index=data.items.findIndex(v=>v.id===x.id);
if(index>=0){let live=data.items[index];if(editing&&live.updatedAt!==editing.updatedAt&&!confirm('这篇文章在你打开页面后已被其他设备修改。确定要覆盖最新版本吗？'))return null;data.items[index]={...live,...x}}
else data.items.push(x);return data
},'knowledge: '+(editing?'update ':'create ')+x.title);
btn.disabled=false;btn.textContent='保存';
if(ok){selected=x.id;history.replaceState(null,'','#doc='+encodeURIComponent(selected));$('editor').close();render()}
};
function legacyMigrator(){
try{let data=JSON.parse(localStorage.getItem(LEGACY)||'[]');if(Array.isArray(data))legacy=data.filter(x=>x&&x.id&&x.title)}catch(e){legacy=[]}
if(!legacy.length)return;let box=$('migration');box.hidden=false;box.append(node('p','检测到当前浏览器仍有 '+legacy.length+' 篇旧本机文档；尚未迁移到 GitHub。'));
let button=node('button','审核并迁移旧文档','small-btn');box.append(button);
button.onclick=async()=>{
const titles=legacy.map(x=>'· '+x.title).join('\n');
if(!confirm('准备将以下本机文档发布到【公开】GitHub 仓库和网站（可能含敏感内容，请先检查）：\n\n'+titles.slice(0,1100)+'\n\n确定所有文档均可以公开吗？'))return;
const ok=await saveItems(data=>{let seen=new Set(data.items.map(x=>x.id)),added=0;legacy.forEach(x=>{if(seen.has(x.id))return;data.items.push(x);seen.add(x.id);added++});if(!added){alert('这些文档已在在线知识库中，无须重复迁移。');return null}return data},'knowledge: migrate explicitly approved browser documents');
if(ok){try{localStorage.removeItem(LEGACY)}catch(e){}legacy=[];box.replaceChildren(node('p','旧文档已提交到 GitHub，浏览器本地旧副本已清除。'));populate()}
}
}
async function init(){populate();legacyMigrator();render();try{const r=await fetch('./knowledge.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(data.version!==1||!Array.isArray(data.items))throw Error('数据格式错误');shared=data.items;populate();render();inform('已连接 GitHub 发布的知识库 · '+shared.length+' 篇文档')}catch(e){loadError='知识库读取失败，请刷新网页重试。';inform(loadError,true);render()}}
window.addEventListener('hashchange',()=>{let id=new URLSearchParams(location.hash.replace(/^#/,'')).get('doc');if(id){selected=id;render()}});
init();
})();</script></body></html>
