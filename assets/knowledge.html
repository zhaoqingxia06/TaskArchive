<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库 · TaskArchive</title><style>
:root{--ink:#1c2738;--blue:#30466f;--muted:#77808a;--line:#dededb;--paper:#faf9f6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}.wrap{max-width:1080px;margin:auto;padding:24px 36px}a{color:var(--blue)}nav{display:flex;gap:24px}nav a{text-decoration:none}nav a[aria-current]{font-weight:700;border-bottom:2px solid var(--blue)}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:52px 0 28px}h1{font:700 40px Georgia,serif;margin:0 0 8px}p{margin:0;color:var(--muted)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;padding:9px 15px;border-radius:8px;color:var(--ink)}.primary{background:var(--blue);color:white;border-color:var(--blue)}.notice{background:#eef2f6;padding:14px 18px;border-radius:10px;color:#526075;margin:20px 0}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.bar input{flex:1;min-width:180px}input,select,textarea{border:1px solid var(--line);background:white;border-radius:7px;padding:10px;color:var(--ink)}.layout{display:grid;grid-template-columns:210px 1fr;gap:36px}.filters button{display:block;width:100%;text-align:left;background:transparent;border:0;margin-bottom:4px}.filters button.active{background:#e8edf5;color:var(--blue);font-weight:600}.eyebrow{color:var(--muted);font-size:12px}.section{border-top:1px solid var(--line);padding:22px 0}.section h2{font-size:17px;margin:0 0 8px}.entry{border-bottom:1px solid var(--line);padding:16px 0}.entry h3{margin:0 0 5px;font-size:16px}.meta{color:var(--muted);font-size:12px}.entry p{color:#495260;white-space:pre-wrap;overflow-wrap:anywhere}.entry details{margin-top:10px}.actions{display:flex;gap:8px;margin-top:12px}.empty{padding:38px 0;color:var(--muted)}dialog{width:min(680px,calc(100% - 24px));max-height:90vh;border:0;border-radius:14px;padding:24px;box-shadow:0 10px 60px #0003}dialog::backdrop{background:#1c273855}form{display:grid;gap:12px}label{display:grid;gap:4px;font-size:13px}textarea{min-height:80px;resize:vertical}.row{display:flex;gap:8px;justify-content:flex-end}.error{color:#a32626}[hidden]{display:none!important}@media(max-width:650px){.wrap{padding:20px}header{margin:36px 0 20px;display:block}header button{margin-top:16px}.layout{display:block}.filters{display:flex;overflow:auto;gap:5px;margin-bottom:16px}.filters button{width:auto;white-space:nowrap}h1{font-size:34px}}
</style></head><body><div class="wrap"><nav aria-label="主要页面"><a href="./index.html">任务档案</a><a href="./knowledge.html" aria-current="page">知识库</a></nav><header><div><h1>知识库</h1><p>把对话中的知识与经验，整理成可以回顾的主题。</p></div><button class="primary" id="add">＋ 新建知识</button></header><div class="notice">知识保存在当前浏览器，不会自动同步到其他设备。清除浏览器数据可能导致丢失，请定期导出备份；同一设备的其他使用者也可能查看。</div><div class="bar"><input id="search" type="search" placeholder="搜索标题、主题、内容或别名" aria-label="搜索知识"><button id="export">导出备份</button><button id="importBtn">导入备份</button><input id="file" type="file" accept="application/json,.json" hidden></div><p id="error" class="error" role="alert"></p><div class="layout"><aside class="filters" id="filters" aria-label="领域筛选"></aside><main><section class="section"><span class="eyebrow">RECENT</span><h2>最近新增与更新</h2><div id="recent"></div></section><section class="section"><span class="eyebrow">KNOWLEDGE</span><h2>全部知识</h2><div id="list"></div></section></main></div></div><dialog id="editor"><form id="form"><h2 id="formTitle">新建知识</h2><label>领域<select id="category" required></select></label><label>主题<input id="topic" required placeholder="如：听力测试与听力图"></label><label>标题<input id="title" required placeholder="如：听力图怎么看"></label><label>一句核心结论<textarea id="summary" required></textarea></label><label>知识与实践<textarea id="body" placeholder="记录关键原理、应用、经验和取舍"></textarea></label><label>待验证<textarea id="pending" placeholder="尚未确认的问题"></textarea></label><label>来源与关联<textarea id="source" placeholder="记录对话来源、时间或链接；未知留空"></textarea></label><label>别名或关键词<input id="aliases" placeholder="例如：辅听、助听"></label><p id="formError" class="error" role="alert"></p><div class="row"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog><script>
(()=>{'use strict';const KEY='taskarchive.knowledge.v1', categories=['语音与 AI','听力与无障碍','产品与研究方法','产品与案例观察','个人成长与生活'];const $=id=>document.getElementById(id);let items=[],filter='全部',editing=null;const fields=['category','topic','title','summary','body','pending','source','aliases'];function read(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(x))throw Error();items=x}catch(e){$('error').textContent='本地数据无法读取，请先导入备份；原数据未被覆盖。';items=[]}}function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));items=next;return true}catch(e){$('error').textContent='保存失败，请检查浏览器存储空间或权限。';return false}}function el(tag,text,cls){let n=document.createElement(tag);n.textContent=text||'';if(cls)n.className=cls;return n}function stamp(v){let d=new Date(v);return Number.isNaN(d.getTime())?'时间未知':d.toLocaleDateString('zh-CN')}function render(){let q=$('search').value.trim().toLowerCase(), chosen=items.filter(x=>(filter==='全部'||x.category===filter)&&fields.some(k=>String(x[k]||'').toLowerCase().includes(q))).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));$('filters').replaceChildren();['全部',...categories].forEach(c=>{let b=el('button',c,c===filter?'active':'');b.type='button';b.onclick=()=>{filter=c;render()};$('filters').append(b)});$('recent').replaceChildren();let recent=items.slice().sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt))).slice(0,3);if(!recent.length)$('recent').append(el('p','还没有知识，添加第一条后会显示在这里。','empty'));recent.forEach(x=>{let p=el('p',`${stamp(x.updatedAt)} · ${x.title}：${x.summary}`);$('recent').append(p)});$('list').replaceChildren();if(!chosen.length){$('list').append(el('p',items.length?'没有找到匹配的知识。':'知识库还是空的。可以先手动添加，或导入已有备份。','empty'));return}let groups=new Map();chosen.forEach(x=>{let k=x.category+' / '+x.topic;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});groups.forEach((arr,key)=>{let group=el('div');group.append(el('h3',key));arr.forEach(x=>{let card=el('article','','entry');card.append(el('h3',x.title),el('div',`更新 ${stamp(x.updatedAt)}${x.createdAt===x.updatedAt?' · 新增':''}`,'meta'),el('p',x.summary));let d=el('details'),s=el('summary','查看详情');d.append(s);[['知识与实践',x.body],['待验证',x.pending],['来源与关联',x.source]].forEach(([name,value])=>{if(value){d.append(el('h4',name),el('p',value))}});card.append(d);let actions=el('div','','actions'),edit=el('button','编辑'),del=el('button','删除');edit.onclick=()=>open(x);del.onclick=()=>{if(confirm('删除这条知识？此操作无法撤销。')){if(save(items.filter(a=>a.id!==x.id)))render()}};actions.append(edit,del);card.append(actions);group.append(card)});$('list').append(group)})}function open(x){editing=x||null;$('form').reset();$('formError').textContent='';fields.forEach(k=>$(k).value=x?.[k]||'');if(!x)$('category').value=categories[0];$('formTitle').textContent=x?'编辑知识':'新建知识';$('editor').showModal()}categories.forEach(c=>{let o=el('option',c);o.value=c;$('category').append(o)});$('add').onclick=()=>open();$('cancel').onclick=()=>$('editor').close();$('search').oninput=render;$('form').onsubmit=e=>{e.preventDefault();let now=new Date().toISOString(),x={id:editing?.id||crypto.randomUUID(),createdAt:editing?.createdAt||now,updatedAt:now};fields.forEach(k=>x[k]=$(k).value.trim());if(!x.topic||!x.title||!x.summary){$('formError').textContent='请填写主题、标题和核心结论。';return}if(save(editing?items.map(a=>a.id===x.id?x:a):[...items,x])){$('editor').close();render()}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,items},null,2)],{type:'application/json'}),a=el('a');a.href=URL.createObjectURL(blob);a.download='taskarchive-knowledge-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!Array.isArray(data.items)||data.items.some(x=>!x||typeof x.id!=='string'||!categories.includes(x.category)||typeof x.title!=='string'||typeof x.summary!=='string'))throw Error('文件格式不正确');let merged=new Map(items.map(x=>[x.id,x]));data.items.forEach(x=>{let old=merged.get(x.id);if(!old||String(x.updatedAt)>String(old.updatedAt))merged.set(x.id,x)});if(save([...merged.values()])){ $('error').textContent='';render()}}catch(err){$('error').textContent='导入失败：'+err.message}finally{e.target.value=''}};read();render()})();
</script></body></html>
