<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库 · TaskArchive</title><style>
:root{--bg:#f8f7f4;--panel:#f1f1ed;--ink:#222c3d;--muted:#79818c;--line:#e2e3e1;--blue:#344d78}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #5474ad;outline-offset:2px}.top{max-width:1380px;margin:auto;padding:24px 44px 0;display:flex;gap:28px;color:#718093}.top a[aria-current]{color:var(--blue);font-weight:650;border-bottom:2px solid var(--blue);padding-bottom:9px}.shell{max-width:1380px;margin:0 auto;padding:35px 44px 60px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.head h1{font:700 34px/1.2 Georgia,'Songti SC',serif;letter-spacing:.04em;margin:0 0 8px}.head p{margin:0;color:var(--muted)}.head-actions{display:flex;gap:8px}.small-btn{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.workspace{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:calc(100vh - 200px);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:white}.sidebar{background:#f5f5f2;border-right:1px solid var(--line);padding:20px 14px}.search{width:100%;padding:10px 12px;border:1px solid #dddeda;background:#fff;border-radius:8px;outline-color:var(--blue)}.side-caption{font-size:11px;color:#969da5;letter-spacing:.08em;margin:23px 9px 8px}.tree details{margin:2px 0}.tree summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:7px;color:#4a5361;font-weight:600}.tree summary::-webkit-details-marker{display:none}.tree summary:before{content:'›';font-size:17px;line-height:1;color:#8c96a1;transition:transform .15s}.tree details[open]>summary:before{transform:rotate(90deg)}.tree .topic{margin-left:15px}.tree .topic summary{font-weight:500;font-size:13px}.docs{margin:2px 0 6px 30px}.doc-link{width:100%;display:block;text-align:left;border:0;border-radius:6px;padding:8px 10px;background:transparent;color:#6d7785;font-size:12px;line-height:1.45}.doc-link:hover,.tree summary:hover{background:#e9eced}.doc-link.active{color:#29436e;background:#e4eaf3;font-weight:600}.reader{min-width:0;padding:42px clamp(28px,6vw,86px) 70px}.reader-inner{max-width:760px;margin:auto}.breadcrumb{font-size:12px;color:#9299a3;margin-bottom:32px}.reader h1{font-size:30px;line-height:1.35;margin:0 0 12px;letter-spacing:.01em}.meta{font-size:12px;color:#9198a2;margin:0 0 28px}.lead{font-size:15px;line-height:1.9;color:#3f4b5f;padding:18px 20px;background:#f1f4f8;border-radius:8px}.reader h2{font-size:19px;margin:34px 0 12px;padding-bottom:9px;border-bottom:1px solid #e9eae8}.reader p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95;margin:0 0 12px}.reader .note{color:#6e7885;font-size:13px}.reader .article-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:32px}.reader .article-actions button{border:0;background:transparent;padding:5px 0;color:#6c7e9c;margin-right:10px}.empty{color:var(--muted);padding:20px 8px}.coverage{border-top:1px solid var(--line);padding-top:18px;margin-top:36px;color:#98a0a8;font-size:11px;line-height:1.7}.error{color:#a33;font-size:12px}.mobile-label{display:none}dialog{width:min(680px,calc(100% - 28px));max-height:90vh;border:0;border-radius:12px;padding:24px;box-shadow:0 15px 80px #0003}dialog::backdrop{background:#26334577}form{display:grid;gap:10px}label{display:grid;gap:4px;font-size:13px}input,textarea,select{border:1px solid var(--line);border-radius:7px;padding:9px;background:#fff}textarea{min-height:78px;resize:vertical}.dialog-buttons{display:flex;justify-content:flex-end;gap:8px}.dialog-buttons button{border:1px solid var(--line);border-radius:7px;padding:8px 14px}.info{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:700px){.top{padding:18px 20px 0}.shell{padding:24px 16px 40px}.head{align-items:start}.head h1{font-size:28px}.head p{font-size:12px}.head-actions{flex-wrap:wrap;justify-content:end}.head-actions button{font-size:12px}.workspace{display:block;min-height:0}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:12px}.mobile-label{display:block;font-size:12px;color:var(--muted);margin:10px 3px}.tree{max-height:260px;overflow:auto}.reader{padding:30px 22px 45px}.reader h1{font-size:25px}.breadcrumb{margin-bottom:20px}.lead{font-size:14px}}
</style></head><body><nav class="top" aria-label="主要页面"><a href="./index.html">任务档案</a><a href="./knowledge.html" aria-current="page">知识库</a><a href="./materials.html">资料集</a></nav><div class="shell"><header class="head"><div><h1>知识库</h1><p>按主题整理，留给未来的自己随时回看。</p></div><div class="head-actions"><button class="small-btn" id="export">导出备份</button><button class="small-btn" id="importBtn">导入备份</button><button class="small-btn primary" id="add">＋ 新建文档</button><input type="file" id="file" accept="application/json,.json" hidden></div></header><div class="workspace"><aside class="sidebar"><input id="search" class="search" type="search" placeholder="搜索文档、主题或关键词" aria-label="搜索知识"><p class="side-caption">知识目录</p><p class="mobile-label">展开目录，选择文档阅读</p><div id="tree" class="tree"></div><p id="error" class="error" role="alert"></p></aside><main class="reader" id="reader"><div class="reader-inner"><p class="empty">正在读取知识…</p></div></main></div></div><dialog id="editor"><form id="form"><h2 id="formTitle">新建文档</h2><p class="info">手动新增或编辑保存在当前浏览器；在线发布的文档由整理任务更新。备份文件可用于迁移。</p><label>分类<select id="category" required></select></label><label>主题<input id="topic" required placeholder="如：听力测试与听力图"></label><label>文档标题<input id="title" required></label><label>核心结论<textarea id="summary" required></textarea></label><label>知识与实践<textarea id="body"></textarea></label><label>待验证<textarea id="pending"></textarea></label><label>来源与关联<textarea id="source"></textarea></label><label>关键词<input id="aliases"></label><p id="formError" class="error" role="alert"></p><div class="dialog-buttons"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog><script>
(()=>{'use strict';const KEY='taskarchive.knowledge.v1',categories=['语音与 AI','知识与原理','产品与研究方法','产品与案例观察','产品解析','产品方法论','个人成长与生活'],fields=['category','topic','title','summary','body','pending','source','aliases'];const $=id=>document.getElementById(id);let local=[],shared=[],selected=null,editing=null,coverage='',sourceError=false;const opened=new Set();function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function normalize(x){if(x.category==='听力与无障碍'){let t=[x.topic,x.title].join(' ');return {...x,category:/产品|方案|设计|体验|耳机|设备/.test(t)?'产品与案例观察':'知识与原理'}}return x}function readLocal(){try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(x))throw Error();local=x.map(normalize)}catch(e){$('error').textContent='当前设备的数据读取失败，原数据未被覆盖。'}}function writeLocal(next){try{localStorage.setItem(KEY,JSON.stringify(next));local=next;return true}catch(e){$('error').textContent='保存失败，请检查浏览器存储空间。';return false}}function all(){let m=new Map(shared.map(x=>[x.id,normalize(x)]));local.forEach(x=>{let old=m.get(x.id);if(!old||String(x.updatedAt)>String(old.updatedAt))m.set(x.id,x)});return [...m.values()]}function date(s){let d=new Date(s);return Number.isNaN(d.getTime())?'时间未知':d.toLocaleDateString('zh-CN')}function render(){const items=all(),q=$('search').value.trim().toLowerCase();let found=items.filter(x=>(fields.some(k=>String(x[k]||'').toLowerCase().includes(q))||JSON.stringify(x.sections||[]).toLowerCase().includes(q)));if(!selected||!items.some(x=>x.id===selected))selected=items[0]?.id||null;let tree=$('tree');tree.replaceChildren();if(!found.length)tree.append(node('p',items.length?'没有找到相关文档':'还没有文档','empty'));let grouped=new Map();found.forEach(x=>{let cat=x.category||'待整理',topic=x.topic||'未分类';if(!grouped.has(cat))grouped.set(cat,new Map());let m=grouped.get(cat);if(!m.has(topic))m.set(topic,[]);m.get(topic).push(x)});grouped.forEach((topics,cat)=>{let d=node('details'),sum=node('summary',cat);d.open=!!q||opened.has('c:'+cat)||[...topics.values()].flat().some(x=>x.id===selected);d.ontoggle=()=>d.open?opened.add('c:'+cat):opened.delete('c:'+cat);d.append(sum);topics.forEach((docs,topic)=>{let t=node('details',undefined,'topic'),k='t:'+cat+'|'+topic;t.open=!!q||opened.has(k)||docs.some(x=>x.id===selected);t.ontoggle=()=>t.open?opened.add(k):opened.delete(k);t.append(node('summary',topic));let list=node('div',undefined,'docs');docs.forEach(x=>{let b=node('button',x.title,'doc-link'+(x.id===selected?' active':''));b.type='button';b.onclick=()=>{selected=x.id;render();if(innerWidth<=700)$('reader').scrollIntoView({behavior:'smooth',block:'start'})};list.append(b)});t.append(list);d.append(t)});tree.append(d)});let x=items.find(v=>v.id===selected),reader=$('reader');reader.replaceChildren();let wrap=node('div',undefined,'reader-inner');if(!x){wrap.append(node('p',sourceError?'在线文档暂时无法读取，请稍后刷新。':'暂无文档，等待下一次整理。','empty'));reader.append(wrap);return}wrap.append(node('div',`${x.category||'待整理'}  /  ${x.topic||'未分类'}`,'breadcrumb'),node('h1',x.title),node('p','最近更新 '+date(x.updatedAt),'meta'),node('div',x.summary,'lead'));if(Array.isArray(x.sections)&&x.sections.length){x.sections.forEach(section=>{wrap.append(node('h2',section.title));(section.paragraphs||[]).forEach(paragraph=>wrap.append(node('p',paragraph)))})}else if(x.body){wrap.append(node('h2','知识与实践'));String(x.body).split(/\n+/).filter(Boolean).forEach(p=>wrap.append(node('p',p)))}if(x.pending){wrap.append(node('h2','待验证'),node('p',x.pending,'note'))}if(x.source||x.references?.length){wrap.append(node('h2','来源与关联'));if(x.source)wrap.append(node('p',x.source,'note'));(x.references||[]).forEach(url=>{try{let u=new URL(url);if(u.protocol==='https:'){let a=node('a',u.hostname+' · 查看原始资料');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.style.cssText='display:block;color:#344d78;margin:7px 0;text-decoration:underline';wrap.append(a)}}catch(e){}})}let acts=node('div',undefined,'article-actions'),edit=node('button','编辑本机副本');edit.onclick=()=>open(x);acts.append(edit);if(local.some(y=>y.id===x.id)){let del=node('button','删除本机副本');del.onclick=()=>{if(confirm('删除当前设备上的副本？在线文档会保留。')&&writeLocal(local.filter(y=>y.id!==x.id)))render()};acts.append(del)}wrap.append(acts,node('div',coverage||'在线知识由整理任务更新；手动编辑仅保存在当前设备。','coverage'));reader.append(wrap)}function open(x){editing=x||null;$('form').reset();$('formError').textContent='';fields.forEach(k=>$(k).value=x?.[k]||'');if(!x)$('category').value=categories[0];$('formTitle').textContent=x?'编辑本机副本':'新建文档';$('editor').showModal()}categories.forEach(c=>{let o=node('option',c);o.value=c;$('category').append(o)});$('search').oninput=render;$('add').onclick=()=>open();$('cancel').onclick=()=>$('editor').close();$('form').onsubmit=e=>{e.preventDefault();let now=new Date().toISOString(),x={id:editing?.id||crypto.randomUUID(),createdAt:editing?.createdAt||now,updatedAt:now};fields.forEach(k=>x[k]=$(k).value.trim());if(!x.topic||!x.title||!x.summary){$('formError').textContent='请填写主题、标题和核心结论。';return}let next=local.filter(y=>y.id!==x.id);next.push(x);if(writeLocal(next)){$('editor').close();selected=x.id;render()}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,items:local},null,2)],{type:'application/json'}),a=node('a');a.href=URL.createObjectURL(blob);a.download='taskarchive-local-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!Array.isArray(data.items))throw Error('文件格式不正确');data.items=data.items.map(normalize);if(data.items.some(x=>!x||typeof x.id!=='string'||!categories.includes(x.category)||typeof x.title!=='string'||typeof x.summary!=='string'))throw Error('文件格式不正确');let merged=new Map(local.map(x=>[x.id,x]));data.items.forEach(x=>{let old=merged.get(x.id);if(!old||String(x.updatedAt)>String(old.updatedAt))merged.set(x.id,x)});if(writeLocal([...merged.values()])){$('error').textContent='';render()}}catch(err){$('error').textContent='导入失败：'+err.message}finally{e.target.value=''}};readLocal();fetch('./knowledge.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{if(data.version!==1||!Array.isArray(data.items))throw Error();shared=data.items;coverage=data.coverage||'';render()}).catch(()=>{sourceError=true;coverage='在线文档读取失败；当前显示本机内容。';render()});render()})();
</script></body></html>
