function closeFolderMenu(){document.querySelector('.folder-menu')?.remove()}

function parseSections(text){

function render(){

function populate(){let select=$('category');select.replaceChildren();[...new Set([...directories.map(d=>d.category),...shared.map(x=>x.category).filter(Boolean)])].forEach(c=>{let opt=node('option',c);opt.value=c;select.append(opt)})}
function openEditor(x){editing=x||null;editingText=x?bodyText(x):'';$('form').reset();$('formError').textContent='';fields.forEach(k=>$(k).value=k==='body'?editingText:x?.[k]||'');if(!x&&$('category').options.length)$('category').selectedIndex=0;$('formTitle').textContent=x?'编辑文档':'新建文档';$('editor').showModal()}
function decodeUtf8(value){return new TextDecoder().decode(Uint8Array.from(atob(value.replace(/\s/g,'')),c=>c.charCodeAt(0)))}
function localState(){const raw=localStorage.getItem(LOCAL);if(!raw)return {version:1,patches:{},created:[],directories:null};const state=JSON.parse(raw);if(state.version!==1||!state.patches||!Array.isArray(state.created))throw Error('本机保存数据无法读取');return state}
function applyLocal(base,state){let data=JSON.parse(JSON.stringify(base));data.items=data.items.map(item=>{let patch=state.patches[item.id];if(!patch)return item;let next={...item,...patch.set};for(const key of patch.remove||[])delete next[key];return next});let ids=new Set(data.items.map(x=>x.id));for(const item of state.created)if(!ids.has(item.id))data.items.push(item);if(Array.isArray(state.directories))data.directories=state.directories;return data}
function makeLocalState(base,next){let original=new Map(base.items.map(x=>[x.id,x])),patches={},created=[];for(const item of next.items){let source=original.get(item.id);if(!source){created.push(item);continue}let set={},remove=[];for(const key of Object.keys(item))if(JSON.stringify(item[key])!==JSON.stringify(source[key]))set[key]=item[key];for(const key of Object.keys(source))if(!(key in item))remove.push(key);if(Object.keys(set).length||remove.length)patches[item.id]={set,remove}}return {version:1,patches,created,directories:Array.isArray(next.directories)?next.directories:null}}
async function saveItems(make){if(loading||!baseData)return false;loading=true;try{const before=applyLocal(baseData,localState()),next=make(before);if(!next)return false;const state=makeLocalState(baseData,next);localStorage.setItem(LOCAL,JSON.stringify(state));shared=next.items;directories=folderList(next);populate();render();inform('已保存在当前浏览器 · 不会同步到其他设备');return true}catch(e){inform('保存失败：'+String(e.message||e),true);alert('保存失败，请检查浏览器是否允许网站保存数据。你的修改尚未保存。');return false}finally{loading=false}}

event.preventDefault();const now=new Date().toISOString(),x={...(editing||{}),id:editing?.id||crypto.randomUUID(),createdAt:editing?.createdAt||now,updatedAt:now};

else data.items.push(x);return data
},'knowledge: '+(editing?'update ':'create ')+x.title);

};

async function init(){populate();legacyMigrator();render();try{let data;try{let r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FILE+'?ref=main',{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let f=await r.json();data=JSON.parse(decodeUtf8(f.content))}catch(e){let r=await fetch('./knowledge.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json()}if(data.version!==1||!Array.isArray(data.items))throw Error('数据格式错误');baseData=data;let local=applyLocal(baseData,localState());shared=local.items;directories=folderList(local);if(!selected&&shared.length)selected=shared[0].id;dataLoaded=true;populate();render();inform('原始知识来自网站 · 修改仅保存在当前浏览器')}catch(e){loadError='知识库读取失败，请刷新网页重试。';inform(loadError,true);render()}}
